<!doctype html>
<!--
Assumption: a playful, standalone browser toy, not a change to the inventory system.
Direction: an editorial cover meets a warm copper particle instrument.
Three live compositions explore orbital depth, spiral motion, and fluid waves.
All imagery is generated by the simulation; no network, assets, or build step required.
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100e0c">
<title>引力遊樂場 · Gravity Playground</title>
<style>
:root { color-scheme: dark; --paper:#eee6da; --muted:#b6a999; --accent:#f6ab74; --line:#ffffff26; }
* { box-sizing:border-box; }
body { margin:0; background:#100e0c; color:var(--paper); font-family:"Helvetica Neue","PingFang TC",sans-serif; overflow:hidden; }
button,input { font:inherit; }
button { cursor:pointer; color:inherit; }
button:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:5px; }
button { -webkit-tap-highlight-color:transparent; }
#field { position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
.shell { position:relative; min-height:100svh; display:flex; flex-direction:column; pointer-events:none; padding:30px 42px 24px; }
header { display:flex; justify-content:space-between; align-items:center; gap:20px; }
.wordmark { display:flex; align-items:center; gap:12px; font-size:12px; letter-spacing:.16em; font-weight:600; }
.mark { width:25px; height:25px; border:1px solid var(--accent); border-radius:50%; position:relative; transform:rotate(-35deg); }
.mark:after { content:""; position:absolute; width:35px; height:9px; border:1px solid var(--accent); border-radius:50%; left:-6px; top:6px; }
.edition { font:10px "SFMono-Regular",Consolas,monospace; letter-spacing:.13em; color:var(--muted); }
.hero { margin-top:clamp(62px,12vh,150px); max-width:470px; }
.eyebrow { display:flex; gap:10px; align-items:center; color:var(--accent); font:10px "SFMono-Regular",Consolas,monospace; letter-spacing:.16em; }
.dot { width:5px; height:5px; background:var(--accent); border-radius:50%; }
h1 { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:clamp(70px,8vw,122px); line-height:.88; letter-spacing:-.07em; margin:26px 0 25px; }
h1 em { font-weight:400; color:var(--accent); }
.hero h2 { font-size:19px; font-weight:400; letter-spacing:.28em; margin:0 0 16px; }
.description { font-size:13px; line-height:1.9; color:var(--muted); margin:0; }
.hero-action { pointer-events:auto; margin-top:29px; border:1px solid #e2b79770; background:#e6a56c12; padding:12px 17px; display:flex; align-items:center; gap:32px; font-size:12px; transition:background .2s; }
.hero-action:hover { background:#e6a56c28; }
.hero-action span { font-size:20px; line-height:1; color:var(--accent); }
.annotation { position:absolute; right:42px; top:47%; writing-mode:vertical-rl; font:10px "SFMono-Regular",Consolas,monospace; letter-spacing:.16em; color:var(--muted); }
.console { margin-top:auto; padding-top:44px; }
.console-top { display:flex; justify-content:space-between; align-items:end; margin-bottom:18px; gap:16px; }
.hint { font-size:11px; color:var(--muted); line-height:1.8; }
.hint b { color:var(--paper); font-weight:400; }
.counter { font:10px "SFMono-Regular",Consolas,monospace; color:var(--muted); letter-spacing:.08em; }
.panel { pointer-events:auto; display:grid; grid-template-columns:1.4fr 1fr auto; align-items:center; gap:30px; padding:22px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:linear-gradient(90deg,#100e0ce8,#100e0c70); }
.modes { display:flex; gap:8px; }
.mode { background:transparent; border:1px solid transparent; padding:10px 15px; font-size:12px; color:var(--muted); white-space:nowrap; }
.mode small { font:9px "SFMono-Regular",Consolas,monospace; margin-right:8px; opacity:.65; }
.mode[aria-pressed="true"] { border-color:#ffffff35; color:var(--paper); background:#ffffff08; }
.mode:hover { color:var(--paper); }
.energy { max-width:250px; }
.energy label { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-bottom:12px; }
output { color:var(--accent); font-family:monospace; }
input[type="range"] { width:100%; height:3px; accent-color:var(--accent); cursor:pointer; display:block; }
.actions { display:flex; gap:9px; }
.action { border:1px solid var(--line); background:transparent; padding:11px 13px; font-size:11px; white-space:nowrap; }
.action:hover { background:#ffffff0c; }
footer { display:flex; justify-content:space-between; padding-top:17px; color:var(--muted); font:9px "SFMono-Regular",Consolas,monospace; letter-spacing:.1em; }
#notice { position:fixed; bottom:200px; left:50%; transform:translateX(-50%); padding:10px 18px; background:#27221e; border:1px solid var(--line); font-size:12px; opacity:0; pointer-events:none; transition:opacity .2s; }
#notice.visible { opacity:1; }
@media(min-width:1500px) { .hero { margin-top:15vh; } }
@media(max-height:750px) and (min-width:761px) { .hero { margin-top:45px; } h1 { font-size:85px; margin:20px 0; } .console { padding-top:25px; } }
@media(max-width:1000px) { .panel { gap:15px; grid-template-columns:1.3fr .8fr auto; } .mode { padding:10px 8px; } .action { padding:11px 9px; } }
@media(max-width:760px) {
 body { overflow:auto; }
 .shell { padding:22px 22px 18px; min-height:100svh; }
 .edition { font-size:8px; letter-spacing:0; }
 .wordmark { font-size:10px; letter-spacing:.08em; }
 .hero { margin-top:42px; max-width:300px; }
 h1 { font-size:76px; margin:20px 0; }
 .hero h2 { font-size:16px; }
 .description { font-size:12px; }
 .hero-action { margin-top:20px; padding:10px 14px; }
 .annotation { display:none; }
 .console { padding-top:145px; }
 .console-top { margin-bottom:12px; flex-direction:column; align-items:start; gap:10px; }
 .counter { font-size:8px; }
 .panel { grid-template-columns:1fr auto; gap:18px 20px; padding:14px 0; }
 .modes { grid-column:1/-1; justify-content:space-between; }
 .mode { flex:1; }
 .energy { max-width:none; }
 .actions { gap:6px; }
 .action { font-size:10px; min-width:44px; min-height:44px; }
 footer { font-size:8px; letter-spacing:0; gap:10px; }
 #notice { bottom:220px; }
}
@media(prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<canvas id="field" aria-label="互動粒子畫布：移動吸引粒子，按住產生風暴；也可使用下方按鈕操作。"></canvas>
<main class="shell">
<header><div class="wordmark"><span class="mark" aria-hidden="true"></span> GRAVITY PLAYGROUND</div><div class="edition">INTERACTIVE EXPERIMENT / 001</div></header>
<section class="hero">
<div class="eyebrow"><span class="dot"></span> A LITTLE CHAOS. ALL YOURS.</div>
<h1>Make<br>some <em>space.</em></h1>
<h2>引力遊樂場</h2>
<p class="description">不用想太多，讓宇宙亂一下。<br>移動游標牽引星塵，按住掀起一場風暴。</p>
<button class="hero-action" id="burst">來一場大爆發 <span aria-hidden="true">↗</span></button>
</section>
<div class="annotation" id="annotation">FIG. 01 — ORBITAL DUST</div>
<section class="console" aria-label="粒子控制台">
<div class="console-top"><div class="hint"><b>移動</b> 吸引 &nbsp; / &nbsp; <b>按住</b> 擾動 &nbsp; / &nbsp; <b>放開</b> 回歸<br>觸控螢幕：在空白處拖曳，攪動星塵。</div><div class="counter" id="particle-count"></div></div>
<div class="panel">
<div class="modes" role="group" aria-label="視覺模式">
<button class="mode" data-mode="0" aria-pressed="true"><small>01</small>星環</button>
<button class="mode" data-mode="1" aria-pressed="false"><small>02</small>漩渦</button>
<button class="mode" data-mode="2" aria-pressed="false"><small>03</small>光之海</button>
</div>
<div class="energy"><label for="energy">擾動強度 <output id="energy-value" for="energy">65%</output></label><input id="energy" type="range" min="10" max="100" value="65"></div>
<div class="actions"><button class="action" id="pause" aria-pressed="false">暫停</button><button class="action" id="reset">重置</button><button class="action" id="save">存成桌布</button></div>
</div>
<footer><span>拖動星塵，把時間浪費在漂亮的地方。</span><span>1–3 切換 · SPACE 暫停 · R 重置</span></footer>
</section>
</main>
<div id="notice" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const canvas = document.querySelector('#field');
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const modes = [...document.querySelectorAll('[data-mode]')];
  const pauseButton = document.querySelector('#pause');
  const energyInput = document.querySelector('#energy');
  const energyOutput = document.querySelector('#energy-value');
  const notice = document.querySelector('#notice');
  const count = 2800;
  const particles = new Float32Array(count * 8);
  const palette = [
    ['#f7c79c', '#f3a66c', '#b97548', '#fff2d5'],
    ['#afd7c7', '#6ab3a2', '#427c70', '#e9f4dc'],
    ['#b6c9f5', '#7797d0', '#465f98', '#e1eaff']
  ];
  const accents = ['#f6ab74', '#a4d5bd', '#b1c8fb'];
  const captions = ['FIG. 01 — ORBITAL DUST', 'FIG. 02 — SPIRAL CURRENT', 'FIG. 03 — LIQUID LIGHT'];
  let width = 0, height = 0, dpr = 1, mode = 0, energy = .65;
  let time = 0, lastTime = 0, paused = reduced.matches, frame = 0, noticeTimer;
  const pointer = { x:0, y:0, active:false, down:false };
  const rand = (min, max) => min + Math.random() * (max - min);
  function seed() {
    for (let i = 0; i < count; i++) {
      const k = i * 8;
      particles[k] = rand(0, Math.PI * 2);
      particles[k+1] = Math.sqrt(Math.random());
      particles[k+2] = rand(-1, 1);
      particles[k+3] = 0;
      particles[k+4] = 0;
      particles[k+5] = 0;
      particles[k+6] = 0;
      particles[k+7] = rand(.45, 1.6);
    }
  }
  function resize() {
    width = innerWidth; height = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render(0);
  }
  function render(step) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#100e0c'; ctx.fillRect(0, 0, width, height);
    const mobile = width <= 760;
    const cx = width * (mobile ? .5 : .685);
    const cy = height * (mobile ? .64 : .455);
    const radius = mobile ? Math.min(width * .43, 280) : Math.min(width * .29, height * .48);
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.4);
    halo.addColorStop(0, ['#ad663014','#4b9d8314','#6585c914'][mode]);
    halo.addColorStop(1, '#100e0c00');
    ctx.fillStyle = halo; ctx.fillRect(cx-radius*1.4,cy-radius*1.4,radius*2.8,radius*2.8);
    ctx.strokeStyle = '#d5c2a610'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(cx, cy, radius*1.23, radius*.64, -.4, 0, Math.PI*2); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    const turn = time * .13;
    for (let i = 0; i < count; i++) {
      const k = i * 8, a = particles[k], r = particles[k+1], z = particles[k+2];
      let x, y, depth;
      if (mode === 0) {
        const angle = a + turn * (.6 + r*.5);
        const ring = radius * (.35 + r*.64);
        const px = Math.cos(angle) * ring;
        const py = Math.sin(angle) * ring;
        const tilt = .46 + Math.sin(time*.17)*.08;
        x = px*.92 + py*.29;
        y = py*tilt - px*.3 + z * radius*.035;
        depth = Math.sin(angle);
      } else if (mode === 1) {
        const angle = a + turn*2 + r*7;
        const ring = radius * (.055 + r*.96);
        const arm = (i % 3) * Math.PI*2/3 + r*7 - turn + z*.18;
        x = Math.cos(arm) * ring + Math.cos(angle)*radius*.026;
        y = Math.sin(arm) * ring*.73 + z*radius*.025;
        depth = Math.sin(arm);
      } else {
        const u = (i % 70) / 69, v = Math.floor(i / 70) / 39;
        x = (u-.5)*radius*2.35;
        y = (v-.5)*radius*1.1 + Math.sin(u*9 + time*.9 + v*4)*radius*.13 + Math.cos(v*11-time*.7)*radius*.1;
        y += x*.16;
        depth = v*2-1;
      }
      const baseX = cx+x, baseY = cy+y;
      if (step > 0) {
        let fx = -particles[k+3]*.012, fy = -particles[k+4]*.012;
        if (pointer.active) {
          const dx = pointer.x - (baseX+particles[k+3]), dy = pointer.y - (baseY+particles[k+4]);
          const dist = Math.hypot(dx,dy);
          const reach = radius*.75;
          if (dist < reach && dist > 1) {
            const force = (1-dist/reach) * energy * (pointer.down ? -2.3 : .48);
            fx += dx/dist*force; fy += dy/dist*force;
            if (pointer.down) { fx += -dy/dist*energy*.9; fy += dx/dist*energy*.9; }
          }
        }
        const damping = Math.pow(.94, step);
        particles[k+5] = (particles[k+5]+fx*step)*damping;
        particles[k+6] = (particles[k+6]+fy*step)*damping;
        particles[k+3] += particles[k+5]*step;
        particles[k+4] += particles[k+6]*step;
      }
      const sx = baseX+particles[k+3], sy = baseY+particles[k+4];
      const size = particles[k+7] * (.72+(depth+1)*.22);
      ctx.globalAlpha = .35 + (depth+1)*.24;
      ctx.fillStyle = palette[mode][i % 4];
      ctx.fillRect(sx,sy,size,size);
      if (i % 41 === 0) {
        ctx.globalAlpha = .08;
        ctx.fillRect(sx-size*2,sy-size*2,size*5,size*5);
        ctx.globalAlpha = .3;
        ctx.fillRect(sx-3,sy,7,.6); ctx.fillRect(sx,sy-3,.6,7);
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    window.__ready = true;
  }
  function tick(now) {
    frame = 0;
    if (paused || document.hidden) return;
    const dt = lastTime ? Math.min((now-lastTime)/1000,.033) : 1/60;
    lastTime = now; time += dt; render(dt*60);
    frame = requestAnimationFrame(tick);
  }
  function schedule() { if (!frame && !paused && !document.hidden) { lastTime=0; frame=requestAnimationFrame(tick); } }
  function syncPause() { pauseButton.textContent=paused?'繼續':'暫停'; pauseButton.setAttribute('aria-pressed',String(paused)); }
  function setPaused(value) {
    paused=value; syncPause();
    if (paused) { cancelAnimationFrame(frame); frame=0; } else schedule();
  }
  function message(text) { notice.textContent=text; notice.classList.add('visible'); clearTimeout(noticeTimer); noticeTimer=setTimeout(()=>notice.classList.remove('visible'),1800); }
  function selectMode(next) {
    mode=next;
    modes.forEach((button,index)=>button.setAttribute('aria-pressed',String(index===mode)));
    document.documentElement.style.setProperty('--accent',accents[mode]);
    document.querySelector('#annotation').textContent=captions[mode];
    render(0);
  }
  function burst() {
    for (let i=0;i<count;i++) {
      const k=i*8, a=particles[k], power=rand(5,16)*energy;
      particles[k+5]+=Math.cos(a)*power;
      particles[k+6]+=Math.sin(a)*power;
    }
    setPaused(false); message('宇宙已被你攪亂。');
  }
  function reset() {
    time=0; energy=.65; energyInput.value='65'; energyOutput.value='65%';
    pointer.active=false; pointer.down=false; seed(); selectMode(0); setPaused(reduced.matches); render(0);
    message('回到宇宙的起點。');
  }
  canvas.addEventListener('pointermove',event=>{ pointer.x=event.clientX; pointer.y=event.clientY; pointer.active=true; });
  canvas.addEventListener('pointerdown',event=>{
    pointer.x=event.clientX; pointer.y=event.clientY; pointer.active=true; pointer.down=true;
    canvas.setPointerCapture(event.pointerId);
  });
  function release(event) { pointer.down=false; if(event.pointerType!=='mouse') pointer.active=false; }
  canvas.addEventListener('pointerup',release);
  canvas.addEventListener('pointercancel',()=>{pointer.down=false;pointer.active=false;});
  canvas.addEventListener('lostpointercapture',()=>{pointer.down=false;});
  canvas.addEventListener('pointerleave',()=>{if(!pointer.down) pointer.active=false;});
  window.addEventListener('blur',()=>{pointer.down=false;pointer.active=false;});
  modes.forEach(button=>button.addEventListener('click',()=>selectMode(Number(button.dataset.mode))));
  energyInput.addEventListener('input',()=>{energy=Number(energyInput.value)/100;energyOutput.value=energyInput.value+'%';});
  pauseButton.addEventListener('click',()=>setPaused(!paused));
  document.querySelector('#burst').addEventListener('click',burst);
  document.querySelector('#reset').addEventListener('click',reset);
  document.querySelector('#save').addEventListener('click',()=>{
    canvas.toBlob(blob=>{
      if(!blob) {message('圖片產生失敗，請再試一次。');return;}
      const url=URL.createObjectURL(blob), link=document.createElement('a');
      link.href=url; link.download=`gravity-${['orbit','vortex','waves'][mode]}.png`; link.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000); message('已匯出無字版星塵畫布。');
    },'image/png');
  });
  document.addEventListener('keydown',event=>{
    if(event.target instanceof HTMLElement && event.target.closest('button,input,select,textarea,[contenteditable]')) return;
    if(event.code==='Space') {event.preventDefault();if(!event.repeat)setPaused(!paused);}
    if(['1','2','3'].includes(event.key)) selectMode(Number(event.key)-1);
    if(event.key.toLowerCase()==='r') reset();
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) {cancelAnimationFrame(frame);frame=0;pointer.down=false;pointer.active=false;}
    else schedule();
  });
  reduced.addEventListener('change',()=>setPaused(reduced.matches));
  window.addEventListener('resize',resize);
  document.querySelector('#particle-count').textContent=count.toLocaleString()+' PARTICLES / LIVE CANVAS';
  seed(); resize(); syncPause(); schedule();
})();
</script>
</body>
</html>
